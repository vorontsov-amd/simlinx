- instruction: br
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: movli
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = r3_imm;

- instruction: flush
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simFlush();

- instruction: putpixel
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simPutPixel(r1, r2, r3_imm);

- instruction: b
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.pc_reg = r3_imm;

- instruction: movhi
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = r3_imm << 16;

- instruction: ori
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.regs[r2] | r3_imm;

- instruction: inc_eqi
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //


- instruction: inc_nei
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: add
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.regs[r2] + core.regs[r3_imm];

- instruction: mul
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: store
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.store<uint32_t>(core.regs[r2] + r3_imm, core.regs[r1]);

- instruction: load
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.load<uint32_t>(core.regs[r2] + r3_imm);

- instruction: beq
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: bne
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: ble
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: bgt
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: bleu
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: bgtu
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: shl
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.regs[r2] << r3_imm;

- instruction: sra
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: shr
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: xor
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    //

- instruction: sub
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.regs[r2] - core.regs[r3_imm];

- instruction: clear
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simClearWindow();
