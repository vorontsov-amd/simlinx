- instruction: br
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: movli
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = r3_imm;

- instruction: flush
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simFlush();

- instruction: putpixel
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simPutPixel(core.regs[r1], core.regs[r2], core.regs[r3_imm]);

- instruction: b
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.pc_reg += sext<16>(r3_imm) * 4;

- instruction: movhi
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = sext<32>(r3_imm << 16);

- instruction: ori
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = sext<32>(core.regs[r2] | r3_imm);

- instruction: inc_eqi
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);


- instruction: inc_nei
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: add
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    if (r3_imm < core.regs.size())
      core.regs[r1] = core.regs[r2] + core.regs[r3_imm];
    else
      core.regs[r1] = core.regs[r2] + sext<16>(r3_imm);

- instruction: mul
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: store
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.store<uint32_t>(core.regs[r2] + sext<16>(r3_imm), core.regs[r1]);

- instruction: load
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = sext<32>(core.load<uint32_t>(core.regs[r2] + sext<16>(r3_imm)));

- instruction: beq
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: bne
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: ble
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: bgt
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.pc_reg += (asSigned(core.regs[r1]) > asSigned(core.regs[r2])) ? sext<16>(r3_imm) * 4 : 4;

- instruction: bleu
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: bgtu
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: shl
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = sext<32>(core.regs[r2] << r3_imm);

- instruction: sra
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: shr
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: xor
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    assert(0);

- instruction: sub
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    core.regs[r1] = core.regs[r2] - core.regs[r3_imm];

- instruction: clear
  decode: |
    useR1;
    useR2;
    useR3_IMM;
  execute: |
    simClearWindow();
