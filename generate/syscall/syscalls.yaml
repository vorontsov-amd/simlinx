- name: exit
  args: []
  do: |
    if (core.regs[simlinx::Register::r0])
      // red
      printf("sys_exit [ \033[31m %ld \033[0m ]\n", core.regs[simlinx::Register::r0]);
    else
      // green
      printf("sys_exit [ \033[32m %ld \033[0m ]\n", core.regs[Core::Register::r0]);
    return Fault::TheEndOfTask;

